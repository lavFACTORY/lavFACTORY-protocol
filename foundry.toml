[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]

solc_version = "0.8.24"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
cbor_metadata = false
bytecode_hash = "none"

remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 50
fail_on_revert = false

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"
